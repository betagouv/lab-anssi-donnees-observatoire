services:
  observatoire-db:
    image: docker.io/postgres:18
    networks:
      - lab-network
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=observatoire
    ports:
      - '5434:5432'
    volumes:
      - dbvol-pg18:/var/lib/postgresql

networks:
  lab-network:
    external: true

volumes:
  dbvol-pg18:
    driver: local
